openapi: 3.0.3
info:
  title: WhatsApp Clone - Backend API
  description: >
    Week 1-2 API surface: health check and the 5 authentication
    endpoints. Paste this file into https://editor.swagger.io to
    browse it interactively, or import it directly into Postman
    (File > Import) as an alternative to the hand-built collection in
    /postman.
  version: "0.2.0"
servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /health:
    get:
      summary: Liveness/readiness check
      tags: [System]
      responses:
        "200":
          description: Server, database, and Redis status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: ok }
                  redis: { type: string, example: ok }
                  time: { type: string, format: date-time }

  /auth/register:
    post:
      summary: Create a new account (pending verification)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                phone_number:
                  type: string
                  description: E.164 format. At least one of phone_number/email is required.
                  example: "+14155552671"
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "201":
          description: Account created, pending OTP verification
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  phone_number: { type: string }
                  email: { type: string }
                  created_at: { type: string, format: date-time }
        "400":
          description: Validation failed, or neither phone_number nor email provided
        "409":
          description: An account with this phone number or email already exists

  /auth/verify-otp:
    post:
      summary: Verify the OTP code sent at registration, activating the account
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, code]
              properties:
                identifier:
                  type: string
                  description: The exact phone_number or email used to register
                code: { type: string, minLength: 6, maxLength: 6 }
      responses:
        "200":
          description: Account activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: boolean, example: true }
                  account_status: { type: string, example: active }
        "400":
          description: Invalid or expired code
        "404":
          description: No account found for that identifier
        "429":
          description: Too many incorrect attempts — request a new code

  /auth/login:
    post:
      summary: Authenticate and receive an access + refresh token pair
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string }
                password: { type: string }
                device_name: { type: string, description: "Optional, defaults to 'Unknown device'" }
                platform:
                  type: string
                  enum: [android, ios, web, desktop]
                  description: "Optional, defaults to 'web'"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid identifier or password
        "403":
          description: Account not yet verified, or disabled

  /auth/refresh:
    post:
      summary: Exchange a refresh token for a new access + refresh token pair (rotation)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New token pair issued; the old refresh token is now revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Refresh token is invalid, revoked, or expired

  /auth/logout:
    post:
      summary: Revoke a refresh token, ending that session
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: >
            Always returns success:true — logout is idempotent, so an
            already-invalid token still counts as a successful logout.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }

components:
  schemas:
    TokenResponse:
      type: object
      properties:
        access_token: { type: string, description: "Short-lived JWT (15 min)" }
        refresh_token: { type: string, description: "Long-lived opaque token (30 days)" }
        token_type: { type: string, example: Bearer }
        expires_at: { type: string, format: date-time }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            phone_number: { type: string }
            email: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Not enforced on any endpoint yet — the JWT middleware that
        checks this is built in Week 3 Day 1.
