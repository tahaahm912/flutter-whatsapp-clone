openapi: 3.0.3
info:
  title: WhatsApp Clone - Backend API
  description: |
    Week 1-5 API surface: health check (public + JWT-protected variant),
    the 6 authentication endpoints, the user resource endpoints
    (GET /users/me, GET /users/search, POST /users/keys,
    GET /users/{userId}/keys), and conversation creation
    (POST /conversations). Paste this file into
    https://editor.swagger.io to browse it interactively, or import it
    directly into Postman (File > Import) as an alternative to the
    hand-built collection in /postman.

    ## Error response shape (standardized, Week 3 Day 3)

    Every error response has the same shape:
    ```json
    { "error": "human-readable message", "code": "MACHINE_READABLE_CODE" }
    ```
    Request validation failures also include a `details` field with
    the raw binding error. Always branch on `code`, not on `error`
    (message text may change without notice; codes won't).

    ## All error codes currently in use

    | Code | HTTP status | Where |
    |---|---|---|
    | `VALIDATION_ERROR` | 400 | any endpoint, malformed request body |
    | `IDENTIFIER_REQUIRED` | 400 | register |
    | `IDENTIFIER_TAKEN` | 409 | register |
    | `INVALID_OTP` | 400 | verify-otp — wrong code |
    | `OTP_EXPIRED` | 400 | verify-otp — code expired or never requested |
    | `OTP_TOO_MANY_ATTEMPTS` | 429 | verify-otp |
    | `ALREADY_VERIFIED` | 400 | resend-otp |
    | `OTP_RESEND_TOO_SOON` | 429 | resend-otp — 60s cooldown |
    | `SEARCH_PARAM_REQUIRED` | 400 | users/search — neither or both of phone/email given |
    | `NO_KEYS_AVAILABLE` | 404 | users/{userId}/keys — user exists but no device has uploaded keys yet |
    | `INVALID_KEY_FORMAT` | 400 | users/keys — key material isn't valid base64, or decodes to the wrong byte length |
    | `INVALID_PARTICIPANT` | 400 | conversations — participant_id isn't a valid UUID |
    | `CANNOT_MESSAGE_SELF` | 400 | conversations — participant_id equals the caller's own ID |
    | `PARTICIPANT_NOT_FOUND` | 404 | conversations — no active user matches participant_id |
    | `INVALID_CONVERSATION_ID` | 400 | messages — conversation_id isn't a valid UUID |
    | `INVALID_CLIENT_MESSAGE_ID` | 400 | messages — client_message_id isn't a valid UUID |
    | `NOT_A_PARTICIPANT` | 403 | messages — caller isn't an active participant of the conversation |
    | `CLIENT_MESSAGE_ID_REUSED` | 409 | messages — client_message_id reused across two different conversations (client bug) |
    | `INVALID_BEFORE_MESSAGE_ID` | 400 | messages — before_message_id isn't valid, or doesn't belong to the requested conversation |
    | `INVALID_CREDENTIALS` | 401 | login — also used for "no such account" (never distinguished, by design) |
    | `ACCOUNT_NOT_VERIFIED` | 403 | login |
    | `ACCOUNT_DISABLED` | 403 | login |
    | `REFRESH_TOKEN_INVALID` | 401 | refresh |
    | `REFRESH_TOKEN_EXPIRED` | 401 | refresh |
    | `USER_NOT_FOUND` | 404 | verify-otp, resend-otp, refresh (edge cases) |
    | `AUTH_HEADER_MISSING` | 401 | any route behind RequireAuth |
    | `AUTH_HEADER_MALFORMED` | 401 | any route behind RequireAuth |
    | `TOKEN_INVALID` | 401 | any route behind RequireAuth |
    | `TOKEN_EXPIRED` | 401 | any route behind RequireAuth |
    | `SESSION_REVOKED` | 401 | any route behind RequireAuth — token is valid/unexpired but its device was logged out |
    | `INTERNAL_ERROR` | 500 | any endpoint, unexpected failure |
  version: "0.12.0"
servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /health:
    get:
      summary: Liveness/readiness check
      tags: [System]
      responses:
        "200":
          description: Server, database, and Redis status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: ok }
                  redis: { type: string, example: ok }
                  time: { type: string, format: date-time }

  /health/protected:
    get:
      summary: Same as /health, but requires a valid JWT (test route for the auth middleware)
      tags: [System]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  authenticated_as:
                    type: object
                    properties:
                      user_id: { type: string, format: uuid }
                      device_id: { type: string, format: uuid }
        "401":
          description: >
            Missing, malformed, invalid, or expired token, OR a
            valid/unexpired token whose device was revoked via logout
            (code=SESSION_REVOKED) — see the response body's `code`
            field to distinguish these.

  /users/me:
    get:
      summary: Get the logged-in user's profile
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The authenticated user's profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  phone_number: { type: string }
                  email: { type: string }
                  about: { type: string, description: "Maps to the users.about_text column" }
                  profile_photo_url: { type: string }
                  created_at: { type: string, format: date-time }
        "401":
          description: Same as /health/protected (missing/invalid/expired token, or SESSION_REVOKED)
        "404":
          description: Token was valid but the user no longer exists (code=USER_NOT_FOUND)

  /users/search:
    get:
      summary: Find one user by exact phone number or email match
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: phone
          in: query
          required: false
          schema: { type: string }
          description: E.164 format. Provide exactly one of phone/email, not both.
        - name: email
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: >
            A matching user. Deliberately excludes phone_number/email
            from the response — only name, about, and profile_photo_url
            are returned about a user other than yourself.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  about: { type: string }
                  profile_photo_url: { type: string }
        "400":
          description: Neither or both of phone/email were given (code=SEARCH_PARAM_REQUIRED), or malformed phone/email format
        "401":
          description: Same as /health/protected
        "404":
          description: No active account matches (code=USER_NOT_FOUND) — also returned for pending_verification/disabled accounts, which are not discoverable by design

  /users/keys:
    post:
      summary: Upload Signal Protocol public keys for the calling device
      tags: [Users, Keys]
      security:
        - bearerAuth: []
      description: >
        Only identity_public_key + registration_id are required.
        signed_prekey and one_time_prekeys are optional — this
        endpoint is designed to be called once with just the identity
        key (Week 4 Day 3's Flutter task) and again later with the
        rest (Day 4's task) rather than requiring everything at once.
        Uploading a new signed_prekey automatically deactivates the
        device's previous one (rotation) rather than replacing it —
        old rows are kept for history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity_public_key, registration_id]
              properties:
                identity_public_key: { type: string }
                registration_id: { type: integer }
                signed_prekey:
                  type: object
                  properties:
                    key_id: { type: integer }
                    public_key: { type: string }
                    signature: { type: string }
                one_time_prekeys:
                  type: array
                  items:
                    type: object
                    properties:
                      key_id: { type: integer }
                      public_key: { type: string }
      responses:
        "200":
          description: Reports which pieces were actually stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  identity_key_stored: { type: boolean }
                  signed_prekey_stored: { type: boolean }
                  one_time_prekeys_stored: { type: integer }
        "400":
          description: >
            Missing/malformed request body (code=VALIDATION_ERROR), or
            well-formed but invalid key material — not valid base64,
            or decodes to the wrong byte length for a Curve25519 key/
            XEdDSA signature (code=INVALID_KEY_FORMAT)
        "401":
          description: Same as /health/protected

  /users/{userId}/keys:
    get:
      summary: Fetch a user's public key bundle(s) to start an encrypted session
      tags: [Users, Keys]
      security:
        - bearerAuth: []
      description: >
        Reachable for ANY user, not just yourself — this is how Alice
        gets Bob's public keys to start a chat with him. Returns one
        bundle per active device (a user with multiple devices needs a
        separate encrypted session per device). IMPORTANT: this is a
        stateful GET — each call consumes (permanently marks used) one
        one-time pre-key per device, if one is available. This is
        intentional and matches how the Signal Protocol itself works;
        it is not a caching bug if calling this twice returns a
        different (or null) one_time_prekey the second time.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One key bundle per active device with keys uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string, format: uuid }
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        device_id: { type: string, format: uuid }
                        identity_key:
                          type: object
                          properties:
                            public_key: { type: string }
                            registration_id: { type: integer }
                        signed_prekey:
                          type: object
                          properties:
                            key_id: { type: integer }
                            public_key: { type: string }
                            signature: { type: string }
                        one_time_prekey:
                          type: object
                          nullable: true
                          description: null if this device has run out of one-time pre-keys
                          properties:
                            key_id: { type: integer }
                            public_key: { type: string }
        "401":
          description: Same as /health/protected
        "404":
          description: >
            No such active user (code=USER_NOT_FOUND), or the user
            exists but no device has finished uploading keys yet
            (code=NO_KEYS_AVAILABLE)

  /conversations:
    post:
      summary: Create a direct (1:1) conversation, or return the existing one
      tags: [Conversations]
      security:
        - bearerAuth: []
      description: >
        The caller (from the JWT) is always one of the two
        participants — never supplied in the request body. If the
        caller and participant_id already have a direct conversation,
        that existing conversation is returned (200) instead of
        creating a duplicate (201). Week 5 is plaintext-first per the
        build plan; encryption is layered in during Week 6.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participant_id]
              properties:
                participant_id: { type: string, format: uuid }
      responses:
        "201":
          description: A new conversation was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "200":
          description: An existing direct conversation with this participant was found and returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "400":
          description: >
            Malformed request (code=VALIDATION_ERROR), participant_id
            isn't a valid UUID (code=INVALID_PARTICIPANT), or
            participant_id is the caller's own ID (code=CANNOT_MESSAGE_SELF)
        "401":
          description: Same as /health/protected
        "404":
          description: No active user found for that participant_id (code=PARTICIPANT_NOT_FOUND)
    get:
      summary: List the logged-in user's conversations
      tags: [Conversations]
      security:
        - bearerAuth: []
      description: >
        Ordered by creation time, newest first — a known placeholder;
        once messages exist this should sort by most recent message
        instead, like every real chat app does. other_participant is
        only populated for type="direct" (the only type creatable so
        far) and deliberately excludes phone_number/email, same as
        GET /users/search.
      responses:
        "200":
          description: The conversation list (empty array if the user has none yet)
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        type: { type: string, enum: [direct, group] }
                        created_at: { type: string, format: date-time }
                        other_participant:
                          type: object
                          nullable: true
                          properties:
                            id: { type: string, format: uuid }
                            name: { type: string }
                            about: { type: string }
                            profile_photo_url: { type: string }
        "401":
          description: Same as /health/protected

  /messages:
    post:
      summary: Send a message into a conversation
      tags: [Messages]
      security:
        - bearerAuth: []
      description: >
        Week 5 is plaintext-first (see migration 000006's comment) —
        `body` is sent and stored as plain text for now; Week 6
        replaces this with real per-recipient-device Signal Protocol
        ciphertext. `client_message_id` must be generated by the
        sending device and is required: retrying the exact same send
        (same device, same client_message_id) returns the original
        message (200) instead of creating a duplicate (201) — this is
        what makes it safe for a client to retry after a lost
        response. The message is fanned out to every OTHER active
        participant's active devices; the sender does not get a copy
        via this API and is expected to store its own sent message
        locally.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversation_id, client_message_id, body]
              properties:
                conversation_id: { type: string, format: uuid }
                client_message_id: { type: string, format: uuid }
                body: { type: string, description: "Plaintext for now — see description above" }
      responses:
        "201":
          description: A new message was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "200":
          description: The same client_message_id was already used by this device for this conversation — the original message is returned, not a duplicate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: >
            Malformed request (code=VALIDATION_ERROR), conversation_id
            isn't a valid UUID (code=INVALID_CONVERSATION_ID), or
            client_message_id isn't a valid UUID
            (code=INVALID_CLIENT_MESSAGE_ID)
        "401":
          description: Same as /health/protected
        "403":
          description: You are not an active participant of this conversation (code=NOT_A_PARTICIPANT)
        "409":
          description: >
            client_message_id was already used by this device for a
            DIFFERENT conversation (code=CLIENT_MESSAGE_ID_REUSED) —
            a client bug (client_message_id must be freshly generated
            per message), not a normal retry

  /messages/{conversationId}:
    get:
      summary: Retrieve a conversation's messages, for the calling device
      tags: [Messages]
      security:
        - bearerAuth: []
      description: >
        Returns messages delivered to the CALLING DEVICE specifically
        (message_recipients is per-device) — not "everything sent in
        this conversation," and never the caller's own sent messages
        (see POST /messages). Side effect: any returned message still
        marked "sent" for this device is updated to "delivered" as
        part of serving this response. Ordered oldest-first in the
        response (internally queried newest-first via the
        conversation/created_at index, then reversed).
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
          description: Clamped to 1-100, not rejected if out of range
        - name: before_message_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Pagination cursor — returns messages older than this one
      responses:
        "200":
          description: The message list (empty array if none, or if this device hasn't received anything yet)
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        sender_id: { type: string, format: uuid }
                        message_type: { type: string, example: text }
                        body: { type: string, description: "Plaintext during Week 5" }
                        status: { type: string, enum: [sent, delivered, read] }
                        created_at: { type: string, format: date-time }
        "400":
          description: >
            conversation_id isn't a valid UUID
            (code=INVALID_CONVERSATION_ID), or before_message_id isn't
            valid / doesn't belong to this conversation
            (code=INVALID_BEFORE_MESSAGE_ID)
        "401":
          description: Same as /health/protected
        "403":
          description: You are not an active participant of this conversation (code=NOT_A_PARTICIPANT)

  /auth/register:
    post:
      summary: Create a new account (pending verification)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                phone_number:
                  type: string
                  description: E.164 format. At least one of phone_number/email is required.
                  example: "+14155552671"
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "201":
          description: Account created, pending OTP verification
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  phone_number: { type: string }
                  email: { type: string }
                  created_at: { type: string, format: date-time }
        "400":
          description: Validation failed, or neither phone_number nor email provided
        "409":
          description: An account with this phone number or email already exists

  /auth/verify-otp:
    post:
      summary: Verify the OTP code sent at registration, activating the account
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, code]
              properties:
                identifier:
                  type: string
                  description: The exact phone_number or email used to register
                code: { type: string, minLength: 6, maxLength: 6 }
      responses:
        "200":
          description: Account activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: boolean, example: true }
                  account_status: { type: string, example: active }
        "400":
          description: >
            Wrong code (code=INVALID_OTP) or code expired/never
            requested (code=OTP_EXPIRED) — see the response body's
            `code` field to distinguish them.
        "404":
          description: No account found for that identifier (code=USER_NOT_FOUND)
        "429":
          description: Too many incorrect attempts — request a new code (code=OTP_TOO_MANY_ATTEMPTS)

  /auth/resend-otp:
    post:
      summary: Generate and re-send a fresh OTP code for an unverified account
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: { type: string }
      responses:
        "200":
          description: A new code was generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean, example: true }
        "400":
          description: Account is already verified
        "404":
          description: No account found for that identifier
        "429":
          description: Requested again too soon (60 second cooldown per identifier)

  /auth/login:
    post:
      summary: Authenticate and receive an access + refresh token pair
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string }
                password: { type: string }
                device_name: { type: string, description: "Optional, defaults to 'Unknown device'" }
                platform:
                  type: string
                  enum: [android, ios, web, desktop]
                  description: "Optional, defaults to 'web'"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid identifier or password
        "403":
          description: Account not yet verified, or disabled

  /auth/refresh:
    post:
      summary: Exchange a refresh token for a new access + refresh token pair (rotation)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New token pair issued; the old refresh token is now revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Refresh token is invalid, revoked, or expired

  /auth/logout:
    post:
      summary: Revoke a refresh token, ending that session
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: >
            Always returns success:true — logout is idempotent, so an
            already-invalid token still counts as a successful logout.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }

components:
  schemas:
    TokenResponse:
      type: object
      properties:
        access_token: { type: string, description: "Short-lived JWT (15 min)" }
        refresh_token: { type: string, description: "Long-lived opaque token (30 days)" }
        token_type: { type: string, example: Bearer }
        expires_at: { type: string, format: date-time }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            phone_number: { type: string }
            email: { type: string }
    ConversationResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [direct, group], example: direct }
        created_at: { type: string, format: date-time }
    MessageResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        sender_id: { type: string, format: uuid }
        client_message_id: { type: string, format: uuid }
        message_type: { type: string, example: text }
        body: { type: string, description: "Plaintext during Week 5 — see /messages description" }
        created_at: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Required on every endpoint marked `security: bearerAuth` above
        — send as `Authorization: Bearer <access_token>`.
