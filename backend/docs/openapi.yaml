openapi: 3.0.3
info:
  title: WhatsApp Clone - Backend API
  description: |
    Week 1-3 API surface: health check (public + JWT-protected variant)
    and the 6 authentication endpoints. Paste this file into
    https://editor.swagger.io to browse it interactively, or import it
    directly into Postman (File > Import) as an alternative to the
    hand-built collection in /postman.

    ## Error response shape (standardized, Week 3 Day 3)

    Every error response has the same shape:
    ```json
    { "error": "human-readable message", "code": "MACHINE_READABLE_CODE" }
    ```
    Request validation failures also include a `details` field with
    the raw binding error. Always branch on `code`, not on `error`
    (message text may change without notice; codes won't).

    ## All error codes currently in use

    | Code | HTTP status | Where |
    |---|---|---|
    | `VALIDATION_ERROR` | 400 | any endpoint, malformed request body |
    | `IDENTIFIER_REQUIRED` | 400 | register |
    | `IDENTIFIER_TAKEN` | 409 | register |
    | `INVALID_OTP` | 400 | verify-otp — wrong code |
    | `OTP_EXPIRED` | 400 | verify-otp — code expired or never requested |
    | `OTP_TOO_MANY_ATTEMPTS` | 429 | verify-otp |
    | `ALREADY_VERIFIED` | 400 | resend-otp |
    | `OTP_RESEND_TOO_SOON` | 429 | resend-otp — 60s cooldown |
    | `INVALID_CREDENTIALS` | 401 | login — also used for "no such account" (never distinguished, by design) |
    | `ACCOUNT_NOT_VERIFIED` | 403 | login |
    | `ACCOUNT_DISABLED` | 403 | login |
    | `REFRESH_TOKEN_INVALID` | 401 | refresh |
    | `REFRESH_TOKEN_EXPIRED` | 401 | refresh |
    | `USER_NOT_FOUND` | 404 | verify-otp, resend-otp, refresh (edge cases) |
    | `AUTH_HEADER_MISSING` | 401 | any route behind RequireAuth |
    | `AUTH_HEADER_MALFORMED` | 401 | any route behind RequireAuth |
    | `TOKEN_INVALID` | 401 | any route behind RequireAuth |
    | `TOKEN_EXPIRED` | 401 | any route behind RequireAuth |
    | `SESSION_REVOKED` | 401 | any route behind RequireAuth — token is valid/unexpired but its device was logged out |
    | `INTERNAL_ERROR` | 500 | any endpoint, unexpected failure |
  version: "0.3.0"
servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /health:
    get:
      summary: Liveness/readiness check
      tags: [System]
      responses:
        "200":
          description: Server, database, and Redis status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: ok }
                  redis: { type: string, example: ok }
                  time: { type: string, format: date-time }

  /health/protected:
    get:
      summary: Same as /health, but requires a valid JWT (test route for the auth middleware)
      tags: [System]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  authenticated_as:
                    type: object
                    properties:
                      user_id: { type: string, format: uuid }
                      device_id: { type: string, format: uuid }
        "401":
          description: >
            Missing, malformed, invalid, or expired token, OR a
            valid/unexpired token whose device was revoked via logout
            (code=SESSION_REVOKED) — see the response body's `code`
            field to distinguish these.

  /auth/register:
    post:
      summary: Create a new account (pending verification)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                phone_number:
                  type: string
                  description: E.164 format. At least one of phone_number/email is required.
                  example: "+14155552671"
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "201":
          description: Account created, pending OTP verification
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  phone_number: { type: string }
                  email: { type: string }
                  created_at: { type: string, format: date-time }
        "400":
          description: Validation failed, or neither phone_number nor email provided
        "409":
          description: An account with this phone number or email already exists

  /auth/verify-otp:
    post:
      summary: Verify the OTP code sent at registration, activating the account
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, code]
              properties:
                identifier:
                  type: string
                  description: The exact phone_number or email used to register
                code: { type: string, minLength: 6, maxLength: 6 }
      responses:
        "200":
          description: Account activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: boolean, example: true }
                  account_status: { type: string, example: active }
        "400":
          description: >
            Wrong code (code=INVALID_OTP) or code expired/never
            requested (code=OTP_EXPIRED) — see the response body's
            `code` field to distinguish them.
        "404":
          description: No account found for that identifier (code=USER_NOT_FOUND)
        "429":
          description: Too many incorrect attempts — request a new code (code=OTP_TOO_MANY_ATTEMPTS)

  /auth/resend-otp:
    post:
      summary: Generate and re-send a fresh OTP code for an unverified account
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: { type: string }
      responses:
        "200":
          description: A new code was generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean, example: true }
        "400":
          description: Account is already verified
        "404":
          description: No account found for that identifier
        "429":
          description: Requested again too soon (60 second cooldown per identifier)

  /auth/login:
    post:
      summary: Authenticate and receive an access + refresh token pair
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string }
                password: { type: string }
                device_name: { type: string, description: "Optional, defaults to 'Unknown device'" }
                platform:
                  type: string
                  enum: [android, ios, web, desktop]
                  description: "Optional, defaults to 'web'"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid identifier or password
        "403":
          description: Account not yet verified, or disabled

  /auth/refresh:
    post:
      summary: Exchange a refresh token for a new access + refresh token pair (rotation)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New token pair issued; the old refresh token is now revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Refresh token is invalid, revoked, or expired

  /auth/logout:
    post:
      summary: Revoke a refresh token, ending that session
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: >
            Always returns success:true — logout is idempotent, so an
            already-invalid token still counts as a successful logout.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }

components:
  schemas:
    TokenResponse:
      type: object
      properties:
        access_token: { type: string, description: "Short-lived JWT (15 min)" }
        refresh_token: { type: string, description: "Long-lived opaque token (30 days)" }
        token_type: { type: string, example: Bearer }
        expires_at: { type: string, format: date-time }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            phone_number: { type: string }
            email: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Not enforced on any endpoint yet — the JWT middleware that
        checks this is built in Week 3 Day 1.
